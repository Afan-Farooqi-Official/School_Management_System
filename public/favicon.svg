<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded square background matching the logo's purple/indigo color -->
  <rect width="64" height="64" rx="14" ry="14" fill="#4F46E5"/>

  <!-- Graduation cap (mortarboard) icon -->
  <!-- Cap base / diploma board -->
  <polygon points="32,16 56,26 32,36 8,26" fill="#ffffff"/>
  <!-- Left side of the cap flap -->
  <rect x="23" y="34" width="18" height="3" rx="1" fill="#ffffff" opacity="0.0"/>
  <!-- The hanging part / tassel base cylinder -->
  <rect x="50" y="26" width="4" height="10" rx="2" fill="#ffffff"/>
  <!-- The tassel drop -->
  <line x1="52" y1="36" x2="52" y2="43" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Cap top square (slightly tilted top) -->
  <polygon points="32,11 40,15 32,19 24,15" fill="#ffffff"/>
  <!-- Diploma scroll sides going down -->
  <path d="M23 34 Q23 46 32 46 Q41 46 41 34" fill="#c7d2fe" opacity="0.85"/>
</svg>